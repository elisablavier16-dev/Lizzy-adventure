<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lizzy's Desert Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one centered column, a night-desert sky on top, a story log that fills like a console, choice buttons pinned under it. Single dark look by choice. */
:root {
  --sky-top: #160f2e;
  --sky-bottom: #4a2358;
  --dune: #2b1a2f;
  --sand: #f0c987;
  --ink: #fff3dd;
  --muted: #c9b2c4;
  --panel: rgba(22, 15, 46, 0.78);
  --panel-line: rgba(240, 201, 135, 0.28);
  --lizzy: #8be07a;
  --danger: #ff6b5b;
  --font-display: "Bowlby One", "Arial Black", sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  background-image: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%, #a2476a 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 48px;
}
.wrap { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 6vw, 2.1rem); line-height: 1.1; margin: 0; color: var(--sand); text-wrap: balance; }
h1 small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.lives { font-size: 1.5rem; letter-spacing: 0.15em; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
.lives span { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-right: 8px; font-weight: 800; }
#log {
  min-height: 46vh; max-height: 56vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
#log p { margin: 0; animation: rise 0.35s ease-out both; overflow-wrap: anywhere; }
#log p.lizzy { color: var(--lizzy); font-weight: 700; }
#log p.echo { color: var(--muted); text-align: right; font-style: italic; }
#log p.bad { color: var(--danger); font-weight: 800; }
#log p.win { color: var(--sand); font-weight: 800; }
#log p.credit { color: var(--muted); font-size: 0.85rem; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.prompt { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 800; min-height: 1.2em; }
#choices { display: flex; flex-wrap: wrap; gap: 10px; min-height: 52px; }
#choices button {
  flex: 1 1 140px; min-height: 52px; padding: 10px 16px;
  font: 800 1rem var(--font-body); color: #2a1520; background: var(--sand);
  border: 0; border-radius: 10px; cursor: pointer; transition: transform 0.12s, background 0.12s;
}
#choices button:hover { background: #ffdca0; transform: translateY(-2px); }
#choices button:focus-visible { outline: 3px solid var(--lizzy); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #log p { animation: none; } #choices button { transition: none; } }
.dunes { height: 56px; border-radius: 10px; background:
  radial-gradient(120px 40px at 18% 100%, var(--dune) 98%, transparent 100%),
  radial-gradient(200px 52px at 55% 100%, #3a2140 98%, transparent 100%),
  radial-gradient(150px 38px at 90% 100%, var(--dune) 98%, transparent 100%); }
</style>

<div class="wrap">
  <header>
    <h1>Lizzy's Desert Journey<small>Help a lizard find her way home</small></h1>
    <div class="lives" aria-label="Lives"><span>Lives</span><b id="hearts"></b></div>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="prompt" id="prompt"></div>
  <div id="choices"></div>
  <div class="dunes" aria-hidden="true"></div>
</div>

<script>
const logEl = document.getElementById("log");
const choicesEl = document.getElementById("choices");
const promptEl = document.getElementById("prompt");
const heartsEl = document.getElementById("hearts");
let lives = 3;

const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

function renderHearts() {
  heartsEl.textContent = "❤️".repeat(Math.max(lives, 0)) + "🖤".repeat(Math.max(3 - lives, 0));
}

function say(text, kind) {
  const p = document.createElement("p");
  p.textContent = text;
  if (kind) p.className = kind;
  else if (text.startsWith("🦎")) p.className = "lizzy";
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}

async function tell(lines, delay = 900) {
  for (const line of lines) {
    const t = typeof line === "string" ? { text: line } : line;
    say(t.text, t.kind);
    await wait(delay);
  }
}

function choose(options, label) {
  promptEl.textContent = label || "What do you do?";
  choicesEl.innerHTML = "";
  return new Promise(resolve => {
    options.forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = o.label;
      b.addEventListener("click", () => {
        choicesEl.innerHTML = "";
        promptEl.textContent = "";
        say("› " + o.label, "echo");
        resolve(o.value);
      });
      choicesEl.appendChild(b);
    });
    const first = choicesEl.querySelector("button");
    if (first) first.focus({ preventScroll: true });
  });
}

async function guessGame(max, intro, winLine) {
  const secret = rand(1, max);
  await tell(intro);
  while (lives > 0) {
    const g = await choose(range(1, max).map(n => ({ label: String(n), value: n })), "Your guess (1-" + max + ")");
    if (g === secret) { await tell([{ text: winLine, kind: "win" }]); return true; }
    lives -= 1;
    renderHearts();
    await tell([{ text: (g < secret ? "🔼 Too small! " : "🔽 Too big! ") + lives + " ❤️ left", kind: lives > 0 ? "" : "bad" }], 500);
  }
  return false;
}

async function gameOver(lines) {
  await tell(lines.concat([{ text: "💀 GAME OVER", kind: "bad" }]), 700);
  await choose([{ label: "Play again 🦎", value: 1 }], "Try another journey?");
  start();
}

function start() {
  lives = 3;
  renderHearts();
  logEl.innerHTML = "";
  choicesEl.innerHTML = "";
  promptEl.textContent = "";
  game();
}

async function game() {
  await tell(["🦎 Hello young adventurer, I can't believe you found me! I am Lizzy the Lizard. A storm hit the desert and now I can't find my home..."], 1400);

  while (true) {
    const a = await choose([{ label: "Yes", value: "yes" }, { label: "No", value: "no" }], "Will you help me find them before nightfall?");
    if (a === "yes") break;
    await tell(["🦎 Oh.. then I will have to face the desert alone.. Please, reconsider 😢"]);
  }

  await tell([
    "🦎 Perfect, let's go then, you will have to guide me through the desert",
    "🦎 I can't wait to see my family again",
    "🏜️ Guide Lizzy in the desert and help her navigate this hostile environment. Lizzy will encounter a few challenges during her journey. Adventurer, take care of Lizzy.",
    "Our little friend walks when she faces two paths"
  ]);

  while (true) {
    const c = await choose([{ label: "Right 🌵", value: "right" }, { label: "Left 🌊", value: "left" }], "Should Lizzy go to the right or to the left?");
    if (c === "right") {
      const ok = await guessGame(5, [
        "🦎 Oh no, Lizzy took the wrong turn!",
        "🐍 A snake blocks the path: Guess my number (1-5) or you never leave!"
      ], "🎉 The snake lets Lizzy pass!");
      if (!ok) { await gameOver([]); return; }
      break;
    }
    await tell(["🌊 You spotted a river, seems pretty safe", "Lizzy walks along the river"]);
    break;
  }

  await tell([
    "The adventure continues...",
    "Lizzy seems to spot a giant tree on the other side of the river",
    "🦎 I remember this tree! My brother and I used to climb on it",
    "Despite its beauty, the river remains home to beautiful creatures (sometimes dangerous)"
  ]);

  while (true) {
    const c = await choose([{ label: "Cross the river 🌊", value: "cross" }, { label: "Wait ⏳", value: "wait" }], "Cross the river or wait?");
    if (c === "cross") break;
    await tell(["🦎 We don't have time, I have to reach my home before nightfall!"]);
  }
  const crocOk = await guessGame(5, [
    "Oh no, a crocodile has been observing Lizzy, he is moving toward her",
    "🐊 Guess my number (1-5) or I will devour you!"
  ], "🎉 The crocodile lets Lizzy cross!");
  if (!crocOk) { await gameOver([]); return; }

  await tell(["Lizzy is not even close to give up!", "and the journey goes on..", "🦂 Lizzy reaches 3 rocks. A scorpion hides under one of them!"]);
  const scorpionRock = rand(1, 3);
  const pick = await choose([1, 2, 3].map(n => ({ label: "Rock " + n + " 🪨", value: n })), "Which rock does Lizzy lift?");
  await wait(900);
  if (pick === scorpionRock) {
    lives -= 1;
    renderHearts();
    await tell([{ text: "🦂 Ouch! The scorpion stings Lizzy! " + lives + " ❤️ left", kind: "bad" }]);
    if (lives <= 0) { await gameOver([]); return; }
  } else {
    await tell(["🪨 Nothing here, Lizzy is safe... and finds a 💧 water drop!"]);
  }

  await tell([
    "It has been a long journey.. Now Lizzy's legs hurt.",
    "🦎 I recognise this hill, my house is behind it!",
    "You noticed an eagle has been flying around Lizzy",
    "🦎 I am scared, help me!",
    "🦅 An eagle dives at Lizzy!"
  ]);
  const e = await choose([{ label: "Hide under a cactus 🌵", value: "hide" }, { label: "Run toward the hill 🏃", value: "run" }], "Hide or run?");
  if (e === "run") {
    await gameOver(["🦅 We told you that Lizzy was exhausted. The eagle is faster than our little friend... it catches Lizzy!"]);
    return;
  }

  await tell([
    "🌵 You are safe, the eagle lost you and flew away",
    { text: "Wow, what a journey! Lizzy has finally reached home!", kind: "win" },
    "🦎 Thank you for helping me find my way home my friend, you are now part of the Kingdom of the Lizards, welcome among us!",
    { text: "by Elisa Blavier", kind: "credit" }
  ]);
  await choose([{ label: "Play again 🦎", value: 1 }], "The end");
  start();
}

start();
</script>

</body></html>
